<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spread</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header id="top">
    <div class="brand" title="Spread — the spreadsheet your agent can use">▦</div><div class="brandname">Spread</div>
    <nav id="docs"></nav>
    <div class="sep"></div>
    <div id="toolslot"></div>
    <div class="grow"></div>
    <div id="activity" title="Latest agent activity"></div>
    <span id="people"></span>
    <span id="ver" title="Workspace version">v0</span>
    <span id="conn" title="Live connection"></span>
    <button id="btnMilestone" class="tb wide" title="Save a named milestone (Ctrl+S)">⚑ Milestone</button>
    <button id="btnSql" class="tb wide" title="SQL over named tables (node:sqlite)">SQL</button>
    <button id="btnHistory" class="tb wide" title="History, diffs, restore">History</button>
  </header>
  <main id="stage">
    <div id="view"></div>
    <aside id="drawer" hidden></aside>
  </main>
  <div id="toasts"></div>
</body>
</html>
